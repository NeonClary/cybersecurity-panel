id: personal_digital_security
name: Personal Digital Security
description: >
  Practical steps to protect your accounts, devices, backups, and identity
  at home — for individuals and families.
audience: individual
levels:
  - id: accounts
    name: Accounts & authentication
    description: Lock down the keys to your digital life.
    items:
      - id: pds_a_1
        title: Password manager
        description: Install a reputable password manager and migrate key accounts.
      - id: pds_a_2
        title: Unique passwords
        description: Replace reused passwords on email, banking, and work accounts.
      - id: pds_a_3
        title: Enable MFA
        description: Turn on multi-factor authentication (prefer app/passkey over SMS).
      - id: pds_a_4
        title: Review recovery options
        description: Confirm recovery email/phone are yours and up to date.
  - id: backups
    name: Backups & recovery
    description: Survive ransomware, loss, and accidental deletion.
    items:
      - id: pds_b_1
        title: Identify critical data
        description: List photos, docs, and credentials you cannot afford to lose.
      - id: pds_b_2
        title: Automated backups
        description: Enable cloud or local backup for those critical files.
      - id: pds_b_3
        title: Offline / immutable copy
        description: Keep at least one backup the ransomware cannot reach.
      - id: pds_b_4
        title: Test a restore
        description: Restore one file successfully so you know recovery works.
  - id: devices
    name: Device security
    description: Keep phones, laptops, and home network hardened.
    items:
      - id: pds_d_1
        title: OS and app updates
        description: Turn on automatic updates for OS, browser, and office apps.
      - id: pds_d_2
        title: Full-disk encryption
        description: Enable BitLocker, FileVault, or device encryption.
      - id: pds_d_3
        title: Screen lock
        description: Require PIN/biometrics; short auto-lock timeout.
      - id: pds_d_4
        title: Router defaults
        description: Change default Wi-Fi admin password; use WPA3/WPA2.
  - id: monitoring
    name: Monitoring & identity
    description: Catch compromise early and protect your identity.
    items:
      - id: pds_m_1
        title: Breach monitoring
        description: Check whether your email appears in known breaches; rotate if so.
      - id: pds_m_2
        title: Login alerts
        description: Enable new-login / new-device alerts on email and banking.
      - id: pds_m_3
        title: Credit freeze option
        description: Know how to freeze credit; freeze if identity risk is elevated.
      - id: pds_m_4
        title: Phishing habits
        description: Pause before clicking; verify unexpected payment or HR requests.
