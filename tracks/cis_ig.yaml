id: cis_ig
name: CIS Controls (IG1 → IG3)
description: >
  Implementation Groups from the CIS Critical Security Controls. Start with
  IG1 (essential cyber hygiene), then IG2 and IG3 safeguards as the
  organization matures. Sample checklist — not the full control catalog.
audience: smb
levels:
  - id: ig1
    name: IG1 — Essential
    description: >
      Foundational safeguards suitable for small organizations and any
      environment that needs a minimum viable security baseline.
    items:
      - id: cis_ig1_1
        title: Inventory enterprise assets (CIS 1)
        description: Actively manage all hardware/endpoints connected to the environment.
      - id: cis_ig1_2
        title: Inventory software assets (CIS 2)
        description: Track authorized software and remove unauthorized applications.
      - id: cis_ig1_3
        title: Data protection basics (CIS 3)
        description: Identify sensitive data, encrypt where feasible, and control sharing.
      - id: cis_ig1_4
        title: Secure configuration (CIS 4)
        description: Apply hardening baselines to endpoints, servers, and cloud services.
      - id: cis_ig1_5
        title: Account management (CIS 5)
        description: Use unique accounts, disable unused ones, and enforce strong authentication.
      - id: cis_ig1_6
        title: Access control management (CIS 6)
        description: Grant least privilege and review access regularly.
      - id: cis_ig1_7
        title: Continuous vulnerability management (CIS 7)
        description: Scan for vulns and patch in a defined window.
      - id: cis_ig1_8
        title: Audit log management (CIS 8)
        description: Collect and retain security-relevant logs for investigation.

  - id: ig2
    name: IG2 — Intermediate
    description: >
      Additional safeguards for organizations with more complex IT and higher
      risk — deeper monitoring, email/web protections, and network defenses.
    items:
      - id: cis_ig2_1
        title: Email & web browser protections (CIS 9)
        description: Filter malicious content, enforce safe browsing defaults, and block risky attachments.
      - id: cis_ig2_2
        title: Malware defenses (CIS 10)
        description: Deploy and monitor anti-malware / EDR across estate.
      - id: cis_ig2_3
        title: Network infrastructure management (CIS 12)
        description: Secure network devices, segment critical systems, and manage remote access.
      - id: cis_ig2_4
        title: Security awareness & skills training (CIS 14)
        description: Role-based training with measured phishing resilience.
      - id: cis_ig2_5
        title: Application software security (CIS 16)
        description: Secure SDLC practices for in-house or heavily customized apps.

  - id: ig3
    name: IG3 — Advanced
    description: >
      Advanced controls for mature security programs facing sophisticated
      threats — fine-grained detection, testing, and application defenses.
    items:
      - id: cis_ig3_1
        title: Network monitoring & defense (CIS 13)
        description: Detect and respond to anomalous network traffic with dedicated tooling.
      - id: cis_ig3_2
        title: Penetration testing (CIS 18)
        description: Conduct regular external/internal pen tests and remediate findings.
      - id: cis_ig3_3
        title: Application defense depth
        description: WAF, runtime protections, or equivalent for critical internet-facing apps.
