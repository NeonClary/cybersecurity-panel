id: cis_ig
name: CIS Controls Implementation Groups
description: >
  Concrete cyber-hygiene safeguards from CIS Controls, tiered as IG1
  (essential for every organization), IG2, and IG3.
audience: smb
levels:
  - id: ig1
    name: IG1 — Essential hygiene
    description: Foundational safeguards every organization should implement.
    items:
      - id: cis_ig1_1
        title: Inventory enterprise assets
        description: Know devices and software that connect to your network.
      - id: cis_ig1_2
        title: Inventory software
        description: Track authorized applications; remove unauthorized ones.
      - id: cis_ig1_3
        title: Data protection basics
        description: Classify sensitive data and apply access restrictions.
      - id: cis_ig1_4
        title: Secure configuration
        description: Harden default configs on servers, endpoints, and network devices.
      - id: cis_ig1_5
        title: Account management
        description: Unique accounts, least privilege, disable dormant accounts.
      - id: cis_ig1_6
        title: Access control management
        description: MFA for remote and privileged access; strong authentication.
      - id: cis_ig1_7
        title: Continuous vulnerability management
        description: Patch critical systems on a defined cadence.
      - id: cis_ig1_8
        title: Audit log management
        description: Collect and retain authentication and admin logs.
  - id: ig2
    name: IG2 — Intermediate
    description: For orgs with sensitive data and dedicated IT capacity.
    items:
      - id: cis_ig2_1
        title: Email and browser protections
        description: Filtering, DNS filtering, and attachment sandboxing.
      - id: cis_ig2_2
        title: Malware defenses
        description: Centrally managed EDR with alerting to a monitored channel.
      - id: cis_ig2_3
        title: Network monitoring
        description: Detect unusual traffic and lateral movement attempts.
      - id: cis_ig2_4
        title: Security awareness training
        description: Recurrent phishing-resistant training for all staff.
      - id: cis_ig2_5
        title: Service provider management
        description: Inventory vendors with data access and review their controls.
  - id: ig3
    name: IG3 — Advanced
    description: For organizations protecting critical assets with mature security teams.
    items:
      - id: cis_ig3_1
        title: Penetration testing
        description: Regular external and internal testing with remediation tracking.
      - id: cis_ig3_2
        title: Application security
        description: Secure SDLC, code review, and dependency scanning.
      - id: cis_ig3_3
        title: Red team / adversary emulation
        description: Exercise detection and response against realistic threat scenarios.
