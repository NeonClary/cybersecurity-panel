id: custom_goal
name: Custom Goal
description: >
  Panel-assisted custom track. Define your own milestones with the advisors
  (e.g. "pass SOC 2 in Q4", "stand up MFA org-wide", "home lab readiness").
  Replace or extend the placeholder items as your plan takes shape.
audience: any
levels:
  - id: define
    name: Define the Goal
    description: Clarify what success looks like, by when, and who is involved.
    items:
      - id: custom_df_1
        title: Goal statement written
        description: One clear sentence describing the outcome you want.
      - id: custom_df_2
        title: Success criteria listed
        description: Measurable conditions that prove the goal is done.
      - id: custom_df_3
        title: Target date set
        description: Agree a realistic deadline or review checkpoint.
      - id: custom_df_4
        title: Stakeholders identified
        description: Note who must approve, fund, or help execute.

  - id: plan
    name: Build the Plan
    description: Break the goal into checkable work items with owners and order.
    items:
      - id: custom_pl_1
        title: Work breakdown drafted
        description: List the major workstreams or phases toward the goal.
      - id: custom_pl_2
        title: Dependencies mapped
        description: Note blockers, vendor wait times, and prerequisite tasks.
      - id: custom_pl_3
        title: Owner per workstream
        description: Assign a responsible person (or yourself) for each stream.
      - id: custom_pl_4
        title: Resources & budget noted
        description: Capture tools, time, or spend needed — even roughly.

  - id: execute
    name: Execute & Track
    description: Do the work, check items off, and adjust as reality changes.
    items:
      - id: custom_ex_1
        title: First milestone completed
        description: Ship the first concrete deliverable or control.
      - id: custom_ex_2
        title: Progress review cadence
        description: Schedule a weekly or biweekly check-in on this goal.
      - id: custom_ex_3
        title: Risks & blockers logged
        description: Keep a short list of what is slowing progress and how to unblock it.
      - id: custom_ex_4
        title: Goal closed or redefined
        description: Mark complete when success criteria are met, or rewrite the goal consciously.
